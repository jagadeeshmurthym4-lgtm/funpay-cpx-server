# CPX Server — Render Blueprint
# Deploy: https://dashboard.render.com/blueprints (paste this file URL)
services:
  - type: web
    name: cashspark-cpx-server
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"

      # ── FCM API Key ───────────────────────────────────────
      # Pick a strong secret string (e.g., "my-secret-key-123") and paste it
      # into the Render Dashboard after deploy. Set the SAME value in
      # Flutter's AppConstants.fcmApiKey.
      - key: FCM_API_KEY
        sync: false

      # ── Firebase Service Account (for FCM) ────────────────
      # After deploy, paste the ENTIRE Firebase JSON key content here.
      # Get it from: Firebase Console → Project Settings → Service Accounts
      # → Generate New Private Key
      - key: SERVICE_ACCOUNT_JSON
        sync: false

      # ── Environment ───────────────────────────────────────
      # ── CPX Research Postback Secret ─────────────────
      # Paste the SAME value as the "secure hash" in the CPX dashboard.
      - key: CPX_SECRET
        sync: false

      # Dev only: "true" accepts unsigned postbacks. NEVER true in production.
      - key: CPX_ALLOW_UNSIGNED
        sync: false
      - key: NODE_ENV
        value: "production"
